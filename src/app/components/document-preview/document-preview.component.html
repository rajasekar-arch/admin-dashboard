<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <object [data]="data.fileUrl" type="application/pdf" width="100%" height="600px">
    <p>Preview not available. <a [href]="data.fileUrl" target="_blank">Download PDF</a>.</p>
  </object>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
