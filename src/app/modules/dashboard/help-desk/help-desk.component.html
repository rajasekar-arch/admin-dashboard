<div class="help-desk-container">
  <mat-tab-group>
    <!-- FAQ Tab -->
    <mat-tab label="FAQs">
      <div class="faq-section">
        <mat-accordion>
          <mat-expansion-panel *ngFor="let faq of faqs">
            <mat-expansion-panel-header>
              <mat-panel-title>
                {{ faq.question }}
              </mat-panel-title>
            </mat-expansion-panel-header>
            <p>{{ faq.answer }}</p>
          </mat-expansion-panel>
        </mat-accordion>
      </div>
    </mat-tab>

    <!-- Create Request Tab -->
    <mat-tab label="Create Request">
      <div class="create-request-section">
        <button mat-raised-button color="primary" (click)="openRequestDialog()">
          Create New Request
        </button>
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
