<div class="home">
  <div class="header">Welcome to the Admin Dashboard</div>
  <div class="dashboard-container">
    <!-- Summary Cards -->
    <div class="flex flex-col lg:flex-row gap-4 pb-20">
      <mat-card class="flex-1 stat-card">
        <h2>{{ totalUsers }}</h2>
        <p>Total Users</p>
      </mat-card>

      <mat-card class="stat-card">
        <h2>{{ activeUsers }}</h2>
        <p>Active Users</p>
      </mat-card>

      <mat-card class="stat-card">
        <h2>{{ newUsers }}</h2>
        <p>New Signups</p>
      </mat-card>
    </div>

    <!-- Charts -->
    <div class="flex flex-col lg:flex-row gap-4">
      <div class="chart-card">
        <h3>Users by Role</h3>
        <canvas
          [ngStyle]="{ width: '100%', height: '100%' }"
          baseChart
          [type]="'pie'"
          [datasets]="pieChartDatasets"
          [labels]="pieChartLabels"
          [options]="pieChartOptions"
          [legend]="pieChartLegend"
        >
        </canvas>
      </div>

      <div class="chart-card">
        <h3>New Users Over Time</h3>
        <canvas
          [ngStyle]="{ width: '100%', height: '100%' }"
          baseChart
          [type]="'line'"
          [data]="lineChartData"
          [options]="lineChartOptions"
          [legend]="lineChartLegend"
        >
        </canvas>
      </div>
    </div>
  </div>
</div>
