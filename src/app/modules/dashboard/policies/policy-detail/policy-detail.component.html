<div class="back-button">
  <button mat-button color="primary" (click)="goBack()">← Back to Policies</button>
</div>

<h2>{{ categoryTitle }}</h2>
<mat-accordion>
  <mat-expansion-panel *ngFor="let policy of policies">
    <mat-expansion-panel-header>
      <mat-panel-title>{{ policy }}</mat-panel-title>
    </mat-expansion-panel-header>
    <p>{{ policy }} content goes here...</p>
  </mat-expansion-panel>
</mat-accordion>
