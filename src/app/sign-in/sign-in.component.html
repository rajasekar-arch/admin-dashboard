<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-4 rounded-xl shadow-xl w-full max-w-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>
    <form #signInForm="ngForm" (ngSubmit)="submitSignIn(signInForm)">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          ngModel
          id="email"
          name="email"
          type="email"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          ngModel
          id="password"
          name="password"
          type="password"
          class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition duration-200"
      >
        Sign In
      </button>
      <p class="mt-4 text-center text-sm">
        Don't have an account?
        <a routerLink="/sign-up" class="text-blue-600 hover:underline">Sign Up</a>
      </p>
      <p *ngIf="error" class="text-red-500 text-sm mt-2">{{ error }}</p>
    </form>
  </div>
</div>
